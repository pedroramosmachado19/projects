<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar</title><meta name="theme-color" content="#820ad1">
<style>:root{--bg:#f6f5fa;--fg:#1c1b22;--card:#fff;--bd:#e5e3ee}@media(prefers-color-scheme:dark){:root{--bg:#141318;--fg:#eceaf3;--card:#1e1d25;--bd:#2d2b38}}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;width:min(320px,90vw);display:grid;gap:12px}
input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{background:#820ad1;color:#fff;border-color:#820ad1}#e{color:#c0392b;min-height:1.2em;margin:0}</style></head>
<body><form id="f"><h2 style="margin:0">💜 Finanças</h2>
<input type="password" id="p" placeholder="Senha" autocomplete="current-password" autofocus required>
<p id="e"></p><button>Entrar</button></form>
<script>f.onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});
if(r.ok)location='/';else e.textContent=(await r.json().catch(()=>({}))).detail||'Erro'}</script></body></html>
